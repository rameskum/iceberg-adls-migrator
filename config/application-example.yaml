# Example environment configuration. Copy to a Unity Catalog Volume and pass it with
#   --spring.config.additional-location=/Volumes/<catalog>/<schema>/<volume>/iceberg-adls-migrator/application.yaml
# Secrets never go in this file: they come from environment variables backed by {{secrets/<scope>/<key>}}.
migration:
  source:
    dataset-id: 0e9c1a5e-4c55-4a3b-9f3e-1c2a7d8b6e01
    # Optional: migrate this snapshot instead of the current one.
    snapshot-id:
    # Copied verbatim into the Hadoop Configuration. Quote dotted keys so their case is kept.
    hadoop:
      "[fs.defaultFS]": hdfs://namenode:8020
  target:
    dataset-id: 5b2f7d3c-8a1e-4f6b-b2d4-9c0e3a7f1d02
    # true: delete everything under the target location and start again from the beginning under a new run id.
    # Needed after a run that did not complete; refused while that run's heartbeat is fresh.
    clean: false
    # azure-sdk: the Azure Blob SDK, signed in with migration.azure.auth below.
    # hadoop: the Hadoop file system of the cluster's Spark session, with the cluster's own access to the storage
    # (Dedicated access mode); migration.azure and block-size are then not used. See "Target clients" in the README.
    client: azure-sdk
    # Azure SDK client: each file in flight holds up to two blocks, one filling while the other is uploaded.
    block-size: 8MB
  datasets:
    stub-directory: /Volumes/<catalog>/<schema>/<volume>/iceberg-adls-migrator/datasets
  # Azure SDK client only.
  azure:
    auth:
      mode: MANAGED_IDENTITY
      # Client id of a user-assigned managed identity; leave empty for system-assigned.
      client-id:
  parquet:
    # Per file in flight; driver memory is about parallel-files x (source row group + this + 2 x block-size).
    row-group-size: 32MB
    page-size: 1MB
    # ZSTD, SNAPPY, GZIP or UNCOMPRESSED
    compression: ZSTD
  processing:
    # Files copied at the same time. Each holds about a source row group, a target row group and two upload blocks.
    parallel-files: 4
  progress:
    # How often the "Progress:" heartbeat line is logged, and the run's heartbeat and progress written to its
    # control row.
    log-every: 30s
  failure:
    # FAIL_FAST or CONTINUE
    on-file-failure: FAIL_FAST
  # Delta tables shared by every migration job, created at startup through the cluster's Spark session.
  state:
    control-table: main.migration.migration_control
    file-table: main.migration.migration_file
    write-retries: 5
    # File outcomes are written in batches: every 50 files, or with the first outcome after 30s.
    outcome-batch-size: 50
    outcome-flush-interval: 30s
    # A RUNNING run whose heartbeat is older than this has died; clean is refused until then. At least 4 x log-every.
    heartbeat-timeout: 5m
