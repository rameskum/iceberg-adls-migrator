name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The Azure adapter tests and the Azure end-to-end test run against Azurite, the Blob API emulator.
      - name: Start Azurite
        run: |
          npx --yes azurite@3.37.0 --inMemoryPersistence --skipApiVersionCheck --loose --blobHost 127.0.0.1 \
            --silent > "$RUNNER_TEMP/azurite.log" 2>&1 &
          for _ in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/azurite.log"
          exit 1

      - name: Verify
        env:
          # Azurite's well-known development account, which the Azure SDK knows by this name.
          AZURE_STORAGE_TEST_CONNECTION_STRING: UseDevelopmentStorage=true
        run: ./mvnw -B verify
