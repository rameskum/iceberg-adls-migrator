# Built-in defaults. Environment-specific values come from the file passed with
# --spring.config.additional-location (see config/application-example.yaml).
spring:
  application:
    name: iceberg-adls-migrator
  main:
    web-application-type: none
    banner-mode: off

logging:
  level:
    # Native Hadoop libraries are optional; their absence is expected and not worth a warning on every run
    org.apache.hadoop.util.NativeCodeLoader: error
    # Reports, at INFO, every engine integration (Spark, Flink, Arrow) that is absent by design
    org.apache.iceberg.formats.FormatModelRegistry: warn
    # Warns on every request that it leaves Content-Length to java.net.http, which sets it from the body anyway
    com.azure.core.http.jdk.httpclient.JdkHttpClient: error
    # Per-scan and per-file chatter that repeats what the migration's own log lines already say
    org.apache.iceberg.hadoop.HadoopTables: warn
    org.apache.iceberg.SnapshotScan: warn
    org.apache.iceberg.metrics.LoggingMetricsReporter: warn
    org.apache.hadoop.io.compress.CodecPool: warn
